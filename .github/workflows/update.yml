name: Update Stable Feed for Adaptly
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser requests
      - run: python Update_Feed.py
        env:
          RSS_URL: ${{ secrets.RSS_URL }}
      - run: |
          git config user.name "feed-bot"
          git config user.email "bot@feed.local"
          git add feed.xml
          git commit -m "Update feed for Adaptly" || echo "No changes"
          git push
